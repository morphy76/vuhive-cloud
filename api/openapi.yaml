        - runs_archived
        - runs_deleted
        - artifacts_cleaned
        - s3_lifecycle_applied
        - dry_run
        - started_at
        - finished_at
        - duration_ms
      properties:
        logs_purged:
          type: integer
          description: Number of expired S3 log objects purged
          example: 42
        reports_purged:
          type: integer
          description: Number of expired S3 report objects purged
          example: 12
        runs_archived:
          type: integer
          description: Number of test runs transitioned to ARCHIVED status
          example: 10
        runs_deleted:
          type: integer
          description: Number of historical test run records permanently deleted
          example: 5
        artifacts_cleaned:
          type: integer
          description: Number of orphaned or expired build artifacts cleaned
          example: 3
        s3_lifecycle_applied:
          type: boolean
          description: Whether native S3 bucket lifecycle configuration rules were successfully applied
          example: true
        dry_run:
          type: boolean
          description: Whether the housekeeping run was executed in dry-run simulation mode
          example: false
        started_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when housekeeping execution started
        finished_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when housekeeping execution finished
        duration_ms:
          type: integer
          format: int64
          description: Execution duration in milliseconds
          example: 1540
        errors:
          type: array
          items:
            type: string
          description: Any non-fatal error messages encountered during execution
        details:
          type: object
          description: Additional granular details or dry-run candidate breakdown

    RetentionPolicyResponse:
      type: object
      required:
        - logs_ttl_days
        - reports_ttl_days
        - runs_ttl_days
        - artifacts_ttl_days
        - archive_only
      properties:
        logs_ttl_days:
          type: integer
          description: Default TTL in days for test run execution logs
          example: 7
        reports_ttl_days:
          type: integer
          description: Default TTL in days for execution summary reports
          example: 30
        runs_ttl_days:
          type: integer
          description: Default TTL in days for historical test runs
          example: 90
        artifacts_ttl_days:
          type: integer
          description: Default TTL in days for compiled scenario binaries
          example: 180
        archive_only:
          type: boolean
          description: Whether expired test runs are archived rather than permanently deleted
          example: false

    ServerSentEvent:
      type: object
      required:
        - id
        - event
        - data
        - timestamp
      properties:
        id:
          type: string
          example: run-a1b2c3d4-1
        event:
          type: string
          enum:
            - run_status_changed
            - build_status_changed
            - system_heartbeat
          example: run_status_changed
        data:
          type: object
          description: Event payload matching the event type
        timestamp:
          type: string
          format: date-time

    RunStatusChangedPayload:
      type: object
      required:
        - run_id
        - suite_id
        - status
        - timestamp
      properties:
        run_id:
          type: string
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        suite_id:
          type: string
          example: e8d665b1-2e67-4228-8ab6-79c5b248a31e
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - COMPLETED
            - FAILED
            - ABORTED
          example: RUNNING
        previous_status:
          type: string
          example: QUEUED
        k8s_job_name:
          type: string
          example: vuhive-runner-3fa85f64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
        exit_code:
          type: integer
          nullable: true
        sla_passed:
          type: boolean
          nullable: true
        metrics:
          $ref: '#/components/schemas/RunMetrics'
        timestamp:
          type: string
          format: date-time

    BuildStatusChangedPayload:
      type: object
      required:
        - artifact_id
        - suite_id
        - platform
        - status
        - timestamp
      properties:
        artifact_id:
          type: string
          example: c7a6e118-20ab-48d6-953b-e01140026e61
        suite_id:
          type: string
          example: e8d665b1-2e67-4228-8ab6-79c5b248a31e
        platform:
          type: string
          example: linux/amd64
        status:
          type: string
          enum:
            - QUEUED
            - BUILDING
            - READY
            - FAILED
          example: READY
        previous_status:
          type: string
          example: BUILDING
        s3_binary_key:
          type: string
          example: artifacts/c7a6e118/runner
        sha256_checksum:
          type: string
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        error_message:
          type: string
        timestamp:
          type: string
          format: date-time

    SystemHeartbeatPayload:
      type: object
      required:
        - status
        - active_clients
        - active_runs
        - timestamp
      properties:
        status:
          type: string
          example: UP
        active_clients:
          type: integer
          example: 2
        active_runs:
          type: integer
          format: int64
          example: 1
        timestamp:
          type: string
          format: date-time

    CreateSuiteRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: checkout-service-load
        description:
          type: string
          example: Checkout service load test scenarios

    UpdateSuiteRequest:
