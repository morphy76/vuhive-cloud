components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC JWT access token issued by Keycloak. Pass in Authorization header as 'Bearer <token>'.
    OAuth2AuthorizationCode:
      type: oauth2
      description: Keycloak Authorization Code flow with PKCE
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/vuhive/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/vuhive/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect identity scope
            profile: User profile and username
            email: User email address
    OAuth2ClientCredentials:
      type: oauth2
      description: Keycloak M2M Client Credentials grant for automated runners and background services
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8080/realms/vuhive/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect identity scope

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "resource not found"

    VersionResponse:
      type: object
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          example: 9b0665a
        build_time:
          type: string
          example: "2026-09-05T11:00:00Z"

    PresignedURLResponse:
      type: object
      required:
        - download_url
        - expires_in_seconds
      properties:
        download_url:
          type: string
          example: "https://minio.vuhive.local/artifacts/runs/run-123/summary.json?X-Amz-Algorithm=..."
        expires_in_seconds:
          type: integer
          example: 900

    RunMetricsDTO:
      type: object
      required:
        - total_iterations
        - total_requests
        - avg_tps
        - p50_duration_ms
        - p90_duration_ms
        - p95_duration_ms
        - p99_duration_ms
        - error_rate_pct
      properties:
        total_iterations:
          type: integer
          format: int64
          example: 50000
        total_requests:
          type: integer
          format: int64
          example: 200000
        avg_tps:
          type: number
          format: double
          description: Average Transactions Per Second (TPS) throughput rate
          example: 1666.67
        p50_duration_ms:
          type: number
          format: double
          description: Median transaction duration (50th percentile latency) in milliseconds
          example: 12.40
        p90_duration_ms:
          type: number
          format: double
          description: 90th percentile latency duration in milliseconds
          example: 28.10
        p95_duration_ms:
          type: number
          format: double
