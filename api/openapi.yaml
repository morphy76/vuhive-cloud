openapi: 3.1.0
info:
  title: vuhive-cloud Control Plane REST API
  description: |
    Cloud-native orchestration engine for distributed high-throughput load testing workloads on Kubernetes.
    Provides APIs for test suite compilation, runner profiles, scheduled execution (CronJobs),
    ad-hoc execution, start barrier synchronization, and historical telemetry / report query.

    All endpoints support Cross-Origin Resource Sharing (CORS) and respond to HTTP OPTIONS preflight
    requests with HTTP 204 No Content, allowing web browsers and tools like Swagger UI to explore and
    interact with the API across different domains and ports.
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Local port-forwarded control plane
  - url: http://localhost:8081
    description: Local Backend-For-Frontend (BFF) service
  - url: http://vuhive-cloud.vuhive-system.svc.cluster.local:8080
    description: In-cluster Kubernetes service

security:
  - BearerAuth: []
  - OAuth2AuthorizationCode:
      - openid
      - profile
      - email

paths:
  /healthz:
    get:
      summary: Liveness / Readiness probe
      description: Returns service health status for Kubernetes probes. Logs only on status transitions (info for good status, warn for bad status) to suppress redundant steady-state logs.
      operationId: healthz
      security: []
      responses:
        '200':
          description: Service is healthy and ready to accept requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/version:
    get:
      summary: Component version
      description: Returns semantic version, git commit hash, and build timestamp.
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Build version details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /api/openapi.yaml:
    get:
      summary: OpenAPI 3.1 YAML specification
      description: Returns raw OpenAPI 3.1 specification definition in YAML format.
      operationId: getOpenAPISpecYAML
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML specification
          content:
            application/yaml:
              schema:
                type: string

  /api/openapi.json:
    get:
      summary: OpenAPI 3.1 JSON specification
      description: Returns raw OpenAPI 3.1 specification definition in JSON format.
      operationId: getOpenAPISpecJSON
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 JSON specification
          content:
            application/json:
              schema:
                type: object

  /api/bff/v1/dashboard:
    get:
      summary: Aggregated composite dashboard overview
      description: Returns an aggregated overview of system health/version, active test run count, recent test suites, and runner profiles concurrently.
      tags:
        - BFF
      responses:
        '200':
          description: Aggregated dashboard metrics and summary overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '500':
          description: Internal server error during dashboard aggregation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/runs/{id}:
    get:
      summary: Unified composite run detail
      description: Retrieves unified test run details combining execution metadata, performance KPIs, and direct pre-signed download links to artifacts (report and logs).
      tags:
        - BFF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique test run identifier
      responses:
        '200':
          description: Unified run detail with artifact links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetailResponse'
        '400':
          description: Invalid run identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Test run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Upstream control plane unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/events:
    get:
      summary: Real-time Server-Sent Events (SSE) stream
      description: |
        Establishes a persistent text/event-stream connection to stream live test run state changes, artifact build transitions, and periodic system heartbeats.
      tags:
        - BFF
      responses:
        '200':
          description: Persistent SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: W3C text/event-stream format with event types run_status_changed, build_status_changed, and system_heartbeat.
        '500':
          description: Internal error subscribing to event stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/status:
    get:
      summary: Aggregated BFF and Control Plane status
      description: Returns health and version metadata from both the BFF and upstream Control Plane.
      tags:
        - BFF
      responses:
        '200':
          description: Aggregated system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BFFStatusResponse'

  /api/bff/v1/sessions:
    post:
      summary: Create client session
      description: Establishes a cached client session in the BFF.
      tags:
        - BFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/sessions/{id}:
    get:
      summary: Retrieve client session
      description: Returns session context for the given session identifier.
      tags:
        - BFF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique session identifier
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/auth/login:
    get:
      summary: Initiate OIDC login with PKCE
      description: Generates PKCE parameters, sets state/verifier cookies, and redirects the browser to the Keycloak authorization URL.
      tags:
        - Authentication
        - BFF
      responses:
        '302':
          description: Redirect to Keycloak authorization endpoint
          headers:
            Location:
              schema:
                type: string
              description: Keycloak authorization URL

  /api/bff/v1/auth/callback:
    get:
      summary: OIDC authorization code callback
      description: Validates PKCE and state cookies, exchanges authorization code for tokens, creates an encrypted server-side session, and sets the HttpOnly session cookie.
      tags:
        - Authentication
        - BFF
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code issued by Keycloak
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: CSRF state parameter matching cookie
      responses:
        '302':
          description: Redirect to application root with session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Encrypted HttpOnly session cookie (vuhive_session)
            Location:
              schema:
                type: string
              description: Application root (/)
        '400':
          description: Invalid state or authorization code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/auth/logout:
    post:
      summary: Terminate user session
      description: Revokes the Keycloak refresh token, deletes the server-side session from PostgreSQL, and clears the session cookie.
      tags:
        - Authentication
        - BFF
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out successfully
        '401':
          description: Unauthenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/auth/me:
    get:
      summary: Retrieve authenticated user identity
      description: Returns the user ID, email, name, and RBAC roles associated with the active session without exposing tokens.
      tags:
        - Authentication
        - BFF
      responses:
        '200':
          description: User identity and roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          description: Unauthenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bff/v1/auth/backchannel-logout:
    post:
      summary: OIDC Backchannel Logout
      description: Receives signed logout tokens from Keycloak to invalidate user sessions across the cluster.
      tags:
        - Authentication
        - BFF
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                logout_token:
                  type: string
                  description: Signed JWT logout token issued by Keycloak
              required:
                - logout_token
      responses:
        '200':
          description: Session successfully invalidated
        '400':
          description: Invalid logout token

  /api/v1/bff/auth/login:
    get:
      summary: Initiate OIDC login with PKCE (alias)
      description: Backwards-compatible alias for /api/bff/v1/auth/login.
      tags:
        - Authentication
        - BFF
      responses:
        '302':
          description: Redirect to Keycloak authorization endpoint

  /api/v1/bff/auth/callback:
    get:
      summary: OIDC authorization code callback (alias)
      description: Backwards-compatible alias for /api/bff/v1/auth/callback.
      tags:
        - Authentication
        - BFF
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to application root with session cookie set
        '400':
          description: Invalid state or authorization code

  /api/v1/bff/auth/logout:
    post:
      summary: Terminate user session (alias)
      description: Backwards-compatible alias for /api/bff/v1/auth/logout.
      tags:
        - Authentication
        - BFF
      responses:
        '200':
          description: Successfully logged out
        '401':
          description: Unauthenticated session

  /api/v1/bff/auth/me:
    get:
      summary: Retrieve authenticated user identity (alias)
      description: Backwards-compatible alias for /api/bff/v1/auth/me.
      tags:
        - Authentication
        - BFF
      responses:
        '200':
          description: User identity and roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          description: Unauthenticated session

  /api/v1/bff/auth/backchannel-logout:
    post:
      summary: OIDC Backchannel Logout (alias)
      description: Receives signed logout tokens from Keycloak to invalidate user sessions across the cluster.
      tags:
        - Authentication
        - BFF
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                logout_token:
                  type: string
                  description: Signed JWT logout token issued by Keycloak
              required:
                - logout_token
      responses:
        '200':
          description: Session successfully invalidated
        '400':
          description: Invalid logout token

  /api/v1/bff/dashboard:
    get:
      summary: Aggregated composite dashboard overview (alias)
      description: Backwards-compatible alias for /api/bff/v1/dashboard.
      tags:
        - BFF
      responses:
        '200':
          description: Aggregated dashboard metrics and summary overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '500':
          description: Internal server error during dashboard aggregation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bff/runs/{id}:
    get:
      summary: Unified composite run detail (alias)
      description: Backwards-compatible alias for /api/bff/v1/runs/{id}.
      tags:
        - BFF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique test run identifier
      responses:
        '200':
          description: Unified run detail with artifact links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetailResponse'
        '404':
          description: Test run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Upstream control plane unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bff/events:
    get:
      summary: Real-time Server-Sent Events (SSE) stream (alias)
      description: Backwards-compatible alias for /api/bff/v1/events.
      tags:
        - BFF
      responses:
        '200':
          description: Persistent SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: W3C text/event-stream format with event types run_status_changed, build_status_changed, and system_heartbeat.
        '500':
          description: Internal error subscribing to event stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bff/status:
    get:
      summary: Aggregated BFF and Control Plane status
      description: Returns health and version metadata from both the BFF and upstream Control Plane.
      tags:
        - BFF
      responses:
        '200':
          description: Aggregated system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BFFStatusResponse'

  /api/v1/bff/sessions:
    post:
      summary: Create client session
      description: Establishes a cached client session in the BFF.
      tags:
        - BFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bff/sessions/{id}:
    get:
      summary: Retrieve client session
      description: Returns session context for the given session identifier.
      tags:
        - BFF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Unique session identifier
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/health:
    get:
      summary: API health status
      description: Returns API health status.
      operationId: apiHealth
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/runs:
    get:
      summary: List and filter test runs
      description: |
        Queries historical test executions with filtering by test suite, execution status,
        originating schedule, and timestamp range. Supports limit/offset pagination and sorts
        results by creation timestamp descending.
      operationId: listRuns
      tags:
        - Runs
      parameters:
        - name: suite_id
          in: query
          description: Filter by parent Test Suite ID
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter by execution status
          required: false
          schema:
            type: string
            enum: [QUEUED, RUNNING, COMPLETED, FAILED, ABORTED]
        - name: schedule_id
          in: query
          description: Filter by recurring Schedule ID
          required: false
          schema:
            type: string
        - name: from
          in: query
          description: Filter test runs created at or after timestamp (RFC 3339)
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-09-01T00:00:00Z"
        - name: to
          in: query
          description: Filter test runs created at or before timestamp (RFC 3339)
          required: false
          schema:
            type: string
            format: date-time
            example: "2026-09-05T23:59:59Z"
        - name: limit
          in: query
          description: Maximum number of runs to return (default 20, max 100)
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of records to skip for pagination
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paginated list of test executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'
    post:
      summary: Trigger an ad-hoc test run
      description: |
        Dispatches an immediate ad-hoc test run execution. Validates the test suite,
        compiled artifact, and runner profile, creates a TestRun record in QUEUED status,
        and manifests an ephemeral Kubernetes batch/v1 Job in the runner namespace.
      operationId: triggerRun
      tags:
        - Runs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRunRequest'
      responses:
        '201':
          description: Test run created and Kubernetes Job dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          description: Invalid request payload or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Suite, artifact, configuration, or runner profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Resource state conflict (e.g. inactive suite or unready artifact)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/runs/{id}:
    get:
      summary: Retrieve test run details and performance KPIs
      description: |
        Returns complete metadata, execution timestamps, duration in milliseconds, exit code,
        SLA compliance, and indexed summary metrics directly from PostgreSQL without reading S3.
      operationId: getRun
      tags:
        - Runs
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the test run
          schema:
            type: string
      responses:
        '200':
          description: Test execution details and performance KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '404':
          description: Test run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/runs/{id}/report:
    get:
      summary: Download full summary.json report
      description: |
        Fetches and returns the full raw summary.json artifact stored in object storage (or indexed in PostgreSQL).
        If presign=true, returns a secure presigned S3 download URL.
      operationId: getRunReport
      tags:
        - Runs
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the test run
          schema:
            type: string
        - name: presign
          in: query
          description: When true, returns a presigned S3 download URL instead of streaming content
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Raw summary.json content or presigned URL response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Raw summary JSON report
                  - $ref: '#/components/schemas/PresignedURLResponse'
        '404':
          description: Test run or report artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Test run is still in-flight (QUEUED or RUNNING); report not yet generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/runs/{id}/logs:
    get:
      summary: Retrieve execution logs (run.log)
      description: |
        Streams or returns the raw container execution log output (run.log) stored in object storage.
        If presign=true, returns a secure presigned S3 download URL.
      operationId: getRunLogs
      tags:
        - Runs
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the test run
          schema:
            type: string
        - name: presign
          in: query
          description: When true, returns a presigned S3 download URL instead of streaming content
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Raw text log stream or presigned URL response
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedURLResponse'
        '404':
          description: Test run or execution log not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Test run is still in-flight; logs not yet finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/runs/{id}/abort:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique TestRun UUID to abort
        schema:
          type: string
    post:
      summary: Abort in-flight test run
      description: |
        Stops and cancels an active (QUEUED or RUNNING) test run on demand.
        Deletes the underlying Kubernetes batch/v1 Job and terminates associated runner pods
        with SIGTERM signal propagation, allowing the runner wrapper to flush partial execution
        logs before pod eviction. Transitions the aggregate state to ABORTED and records audit metadata.
        Rejects abort requests on already finalized runs with 409 Conflict.
      operationId: abortRun
      tags:
        - Runs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbortRunRequest'
      responses:
        '200':
          description: Test execution successfully aborted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          description: Malformed or invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Test run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Run is already in a terminal status (COMPLETED, FAILED, or ABORTED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/runs/{id}/complete:
    post:
      summary: Finalize test run execution and ingest summary report
      description: |
        Internal runner callback endpoint invoked upon test completion to upload summary metrics,
        record exit status, SLA evaluation, and transition the test run lifecycle state.

        The `{id}` path parameter accepts either a domain UUID (for directly-dispatched ad-hoc runs)
        or a Kubernetes Job name (for CronJob-spawned runs). When a UUID lookup returns not-found,
        the control plane automatically retries resolution by `k8s_job_name`.
      operationId: completeRun
      tags:
        - Runs
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the test run
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRunRequest'
      responses:
        '200':
          description: Test run successfully finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          description: Malformed payload or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Test run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Test run already in terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/runs/complete:
    post:
      summary: Finalize test run execution and ingest summary report (callback without path ID)
      description: |
        Internal runner callback endpoint invoked upon test completion where `run_id` is supplied
        in the request body payload. This is the **primary callback target** configured via
        `API_CALLBACK_URL` in Kubernetes runner workloads.

        The `run_id` field accepts either a domain UUID (ad-hoc runs) or a Kubernetes Job name
        (CronJob-spawned runs, where `VUHIVE_RUN_ID` resolves to
        `metadata.labels['batch.kubernetes.io/job-name']`). The control plane will attempt UUID
        lookup first, then fall back to `k8s_job_name` correlation automatically.
      operationId: completeRunFromBody
      tags:
        - Runs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRunRequest'
      responses:
