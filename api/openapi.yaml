  /api/v1/suites/{id}/builds:
    post:
      summary: Upload Go test source and trigger build Job
      description: |
        Accepts a multipart/form-data payload containing the Go test source archive
        (`.tar.gz`) and triggers an ephemeral Kubernetes `batch/v1` Job to compile it
        for the requested target platform. The response is returned immediately; the
        build runs asynchronously.

        **Pre-Build AST Static Analysis & Framework Enforcement**:
        Uploaded archives undergo strict automated static verification before compilation:
        - **Direct Dependency Check**: `go.mod` must declare `github.com/morphy76/vuhive` as a direct dependency.
        - **Inverted Control Driver**: Source code must declare `package scenario` (importing `github.com/morphy76/vuhive/pkg/vuhive` and defining a valid `vuhive.Scenario` entrypoint such as `NewScenario()`, `Scenario()`, `InitScenario()`, or `Register(*vuhive.Engine)`). Defining `package main` or `func main()` is prohibited; the platform injects a trusted `main.go` execution driver.
        - **Package Import Blocklist**: Dangerous packages (`os/exec`, `syscall`, `unsafe`, `plugin`, `runtime/cgo`, `golang.org/x/sys`) are blocked by default. Callers may request an override with `allow_insecure_imports=true` if enabled by cluster administrator policy.

        **Retry semantics**: If a previous compilation attempt for the same suite and
        platform resulted in a `FAILED` artifact, uploading corrected sources via this
        endpoint automatically resets the artifact from `FAILED → PENDING` and prunes
        the stale Kubernetes Job before dispatching a fresh one. No manual database or
        cluster intervention is required — just re-upload and the control plane handles
        the rest.
      operationId: uploadAndBuild
      tags:
        - Builds
      parameters:
        - name: id
          in: path
          required: true
          description: Test Suite ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - source
              properties:
                source:
                  type: string
                  format: binary
                  description: Test scenario archive (.tar.gz or .zip)
                platform:
                  type: string
                  description: Target architecture (linux/amd64, linux/arm64, or all)
                  default: linux/amd64
                allow_insecure_imports:
                  type: boolean
                  description: Optional override to allow suspicious packages (e.g., syscall, unsafe) if permitted by cluster deployment policy
                  default: false
      responses:
        '202':
          description: Compilation build job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildTriggerResponse'
        '400':
          description: Pre-build static analysis or validation failure (missing vuhive dependency, forbidden import, illegal package main, missing scenario contract, or invalid archive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Import blocklist override forbidden by cluster policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Test suite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

