name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Client Validation (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Frontend Dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm --dir web run lint

      - name: Run Frontend Tests
        run: pnpm --dir web run test

      - name: Build Frontend Assets
        run: pnpm --dir web run build

  bff:
    name: Go BFF Validation (Lint & Race Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build Frontend Assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint Go BFF
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m ./cmd/bff/... ./internal/bff/...

      - name: Run Go BFF Tests with Race Detector
        run: go test -v -race ./cmd/bff/... ./internal/bff/...
