# vuhive-cloud — Infrastructure Helm values
# Deploys PostgreSQL and MinIO backing services.
# vuhive-cloud control plane deployment references this release.

# ── PostgreSQL (persistence for runs, suites, profiles, schedules) ───────
postgresql:
  enabled: true
  settings:
    superuser:
      value: postgres
    superuserPassword:
      value: vuhive-dev
  userDatabase:
    name:
      value: vuhive
    user:
      value: vuhive
    password:
      value: vuhive-dev
  # Custom initialization scripts mounted into /docker-entrypoint-initdb.d
  # to provision dedicated databases and schemas during initial cluster startup.
  customScripts:
    02-init-keycloak-db.sh: |
      #!/bin/sh
      set -e
      # Provision dedicated keycloak database if it does not already exist
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE keycloak'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
        GRANT ALL PRIVILEGES ON DATABASE keycloak TO "$USERDB_USER";
        ALTER DATABASE keycloak OWNER TO "$USERDB_USER";
      EOSQL
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d keycloak <<-EOSQL
        GRANT ALL ON SCHEMA public TO "$USERDB_USER";
      EOSQL
  storage:
    requestedSize: 1Gi

# ── MinIO (S3-compatible artifact and log storage) ──────────────────────
minio:
  enabled: true
  mode: standalone
  resources:
    requests:
      memory: "256Mi"
  rootUser: "vuhive-dev"
  rootPassword: "vuhive-dev-secret"
  buckets:
    - name: vuhive-artifacts
      policy: none
      purge: false
  persistence:
    size: 2Gi
  # Dedicated context root and subpath configuration for MinIO Console and S3 API:
  # - CONSOLE_SUBPATH: Configures MinIO Console to serve static assets and APIs under /minio
  # - MINIO_BROWSER_REDIRECT_URL: Redirects browser requests arriving at the MinIO API or root to the console subpath
  environment:
    CONSOLE_SUBPATH: "/minio"
    MINIO_BROWSER_REDIRECT_URL: "/minio"
  # MinIO Browser Console Ingress (routes to console port 9001 under dedicated context root /minio)
  consoleIngress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    path: /minio
    hosts:
      - minio-console.local
    tls: []
  # MinIO S3 API Ingress (routes to S3 API port 9000 under dedicated context root /s3)
  ingress:
    enabled: false
    ingressClassName: ""
    annotations: {}
    path: /s3
    hosts:
      - minio.local
    tls: []

# ── OpenAPI Viewer (interactive Swagger UI for local API exploration) ─────
openapiViewer:
  enabled: false
  image:
    repository: swaggerapi/swagger-ui
    tag: v5.18.2
    pullPolicy: IfNotPresent
  # contextPath specifies the dedicated URL context root / subpath where Swagger UI is hosted.
  # Configures the BASE_URL environment variable in the swagger-ui container, and aligns
  # container liveness/readiness probes and default ingress routing rules.
  # Must start with a leading slash (defaults to "/docs").
  contextPath: "/docs"
  # specUrl specifies the target OpenAPI 3.1 specification URL loaded by Swagger UI.
  # IMPORTANT: Swagger UI is a client-side Single Page Application (SPA) running directly inside
  # the operator's desktop browser (not a server-side proxy inside the cluster). The browser itself
  # must be able to resolve and reach this URL:
  #   - In-Cluster Default ("http://vuhive-vuhive-cloud:8080/openapi.json"): Cluster-internal Service DNS name.
  #     Resolves only within the Kubernetes pod network (e.g. from an in-cluster browser or proxy).
  #   - Local Port-Forwarding (kubectl port-forward): Host desktop browsers cannot resolve cluster-internal
  #     DNS names ("vuhive-vuhive-cloud"). When port-forwarding Swagger UI to localhost, configure:
  #       specUrl: "http://localhost:8080/openapi.json"
  #     and also port-forward the control plane service to localhost:8080.
  #   - Ingress / Reverse Proxy: When Swagger UI and the control plane are exposed behind an Ingress
  #     controller under the same hostname, configure a relative path:
  #       specUrl: "/openapi.json"
  specUrl: "http://vuhive-vuhive-cloud:8080/openapi.json"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: openapi.local
        paths:
          - path: /docs
            pathType: Prefix
    tls: []

# ── Keycloak (OIDC Identity Provider & Authorization Server) ─────────────
keycloak:
  enabled: true
  replicas: 1
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.1.0
    pullPolicy: IfNotPresent
  adminUser: "admin"
  adminPassword: "admin"
  # httpRelativePath specifies the dedicated URL context root / subpath where Keycloak is served.
  # Injected as KC_HTTP_RELATIVE_PATH in Keycloak. Defaults to "/auth" for path-based ingress routing.
  httpRelativePath: "/auth"
  database:
    # Defaults to PostgreSQL service deployed by this infra chart when left empty
    host: ""
    port: 5432
    # Dedicated database for Keycloak to isolate internal IAM tables from application data
    name: "keycloak"
    user: "vuhive"
    password: "vuhive-dev"
    # Optional dedicated schema within the target database (e.g. keycloak).
    # When set, sets KC_DB_SCHEMA in Keycloak.
    schema: ""
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: keycloak.local
        paths:
          - path: /auth
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

