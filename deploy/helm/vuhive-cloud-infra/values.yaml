# vuhive-cloud — Infrastructure Helm values
# Deploys PostgreSQL and MinIO backing services.
# vuhive-cloud control plane deployment references this release.

# ── PostgreSQL (persistence for runs, suites, profiles, schedules) ───────
postgresql:
  enabled: true
  settings:
    superuser:
      value: postgres
    superuserPassword:
      value: vuhive-dev
  userDatabase:
    name:
      value: vuhive
    user:
      value: vuhive
    password:
      value: vuhive-dev
  storage:
    requestedSize: 1Gi

# ── MinIO (S3-compatible artifact and log storage) ──────────────────────
minio:
  enabled: true
  mode: standalone
  resources:
    requests:
      memory: "256Mi"
  rootUser: "vuhive-dev"
  rootPassword: "vuhive-dev-secret"
  buckets:
    - name: vuhive-artifacts
      policy: none
      purge: false
  persistence:
    size: 2Gi

# ── OpenAPI Viewer (interactive Swagger UI for local API exploration) ─────
openapiViewer:
  enabled: false
  image:
    repository: swaggerapi/swagger-ui
    tag: v5.18.2
    pullPolicy: IfNotPresent
  specUrl: "http://vuhive-vuhive-cloud:8080/openapi.json"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: openapi.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
