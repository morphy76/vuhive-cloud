{{- if .Values.keycloak.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vuhive-cloud-infra.keycloak.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuhive-cloud-infra.keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "vuhive-cloud-infra.keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vuhive-cloud-infra.keycloak.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/realm: {{ include (print $.Template.BasePath "/keycloak-realm-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args:
            - start-dev
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.adminUser | default "admin" | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: {{ .Values.keycloak.adminPassword | default "admin" | quote }}
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s" (.Values.keycloak.database.host | default (printf "%s-postgresql" .Release.Name)) (.Values.keycloak.database.port | default 5432) (.Values.keycloak.database.name | default "keycloak") | quote }}
            {{- if .Values.keycloak.database.schema }}
            - name: KC_DB_SCHEMA
              value: {{ .Values.keycloak.database.schema | quote }}
            {{- end }}
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.database.user | default "vuhive" | quote }}
            - name: KC_DB_PASSWORD
              value: {{ .Values.keycloak.database.password | default "vuhive-dev" | quote }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- with .Values.keycloak.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: realm-import
          configMap:
            name: {{ include "vuhive-cloud-infra.keycloak.fullname" . }}-realm
{{- end }}
