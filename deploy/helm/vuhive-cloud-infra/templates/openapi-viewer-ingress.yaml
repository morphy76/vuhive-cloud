{{- if and .Values.openapiViewer.enabled .Values.openapiViewer.ingress.enabled -}}
{{- $fullName := include "vuhive-cloud-infra.openapiViewer.fullname" . -}}
{{- $svcPort := .Values.openapiViewer.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuhive-cloud-infra.openapiViewer.labels" . | nindent 4 }}
  {{- with .Values.openapiViewer.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.openapiViewer.ingress.className }}
  ingressClassName: {{ .Values.openapiViewer.ingress.className }}
  {{- end }}
  {{- if .Values.openapiViewer.ingress.tls }}
  tls:
    {{- range .Values.openapiViewer.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.openapiViewer.ingress.hosts }}
    {{- range .Values.openapiViewer.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ default "ImplementationSpecific" .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
    {{- else }}
    - http:
        paths:
          - path: {{ default "/" .Values.openapiViewer.ingress.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
    {{- end }}
{{- end }}
