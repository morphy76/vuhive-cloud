{{- if .Values.keycloak.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vuhive-cloud-infra.keycloak.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuhive-cloud-infra.keycloak.labels" . | nindent 4 }}
  {{- with .Values.keycloak.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.keycloak.service.type }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "vuhive-cloud-infra.keycloak.selectorLabels" . | nindent 4 }}
{{- end }}
