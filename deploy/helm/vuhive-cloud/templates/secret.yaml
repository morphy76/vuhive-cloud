{{- if or (not .Values.database.existingSecret) (not .Values.s3.existingSecret) (and .Values.auth.enabled (not .Values.auth.runner.existingSecret)) (and (default (dict) .Values.bff).enabled (not (default (dict) (default (dict) .Values.bff).keycloak).clientSecretExistingSecret)) (and (default (dict) .Values.bff).enabled (not (default (dict) (default (dict) .Values.bff).keycloak).sessionCookieSecretRef)) (and (default (dict) .Values.bff).enabled (not (default (dict) (default (dict) .Values.bff).session).encryptionKeyExistingSecret)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vuhive-cloud.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuhive-cloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.database.existingSecret }}
  DATABASE_URL: {{ include "vuhive-cloud.databaseUrl" . | quote }}
  {{- end }}
  {{- if not .Values.s3.existingSecret }}
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if and .Values.auth.enabled (not .Values.auth.runner.existingSecret) }}
  RUNNER_CLIENT_SECRET: {{ (default (dict) (default (dict) .Values.auth).runner).clientSecret | default "" | quote }}
  {{- end }}
  {{- if and (default (dict) .Values.bff).enabled (not (default (dict) (default (dict) .Values.bff).keycloak).clientSecretExistingSecret) }}
  BFF_KEYCLOAK_CLIENT_SECRET: {{ (default (dict) (default (dict) .Values.bff).keycloak).clientSecret | default "" | quote }}
  {{- end }}
  {{- if and (default (dict) .Values.bff).enabled (not (default (dict) (default (dict) .Values.bff).keycloak).sessionCookieSecretRef) }}
  BFF_SESSION_COOKIE_SECRET: {{ (default (dict) (default (dict) .Values.bff).keycloak).sessionCookieSecret | default "" | quote }}
  {{- end }}
  {{- if and (default (dict) .Values.bff).enabled (not (default (dict) (default (dict) .Values.bff).session).encryptionKeyExistingSecret) }}
  BFF_SESSION_ENCRYPTION_KEY: {{ (default (dict) (default (dict) .Values.bff).session).encryptionKey | default "" | quote }}
  {{- end }}
{{- end }}
