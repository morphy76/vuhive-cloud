{{- /*
  namespace.yaml — Conditionally provisions the runner and builder namespaces so that
  scoped Role/RoleBinding objects can be applied against them during helm install.

  The "helm.sh/resource-policy: keep" annotation intentionally prevents Helm from
  deleting these namespaces on `helm uninstall`, as they may contain live runner pods
  or build jobs owned by other releases.
*/}}
{{- if not .Values.rbac.clusterScoped }}
{{- if and .Values.runner.createNamespace .Values.runner.namespace (ne .Values.runner.namespace .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.runner.namespace }}
  labels:
    {{- include "vuhive-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-namespace
  annotations:
    "helm.sh/resource-policy": keep
{{- end }}
{{- if and .Values.builder.createNamespace .Values.builder.namespace (ne .Values.builder.namespace .Release.Namespace) (ne .Values.builder.namespace .Values.runner.namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.builder.namespace }}
  labels:
    {{- include "vuhive-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder-namespace
  annotations:
    "helm.sh/resource-policy": keep
{{- end }}
{{- end }}
