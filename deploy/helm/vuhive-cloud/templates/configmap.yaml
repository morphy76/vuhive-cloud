apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vuhive-cloud.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuhive-cloud.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.targetPort | toString | quote }}
  CORS_ALLOWED_ORIGINS: {{ (default (dict) .Values.cors).allowedOrigins | default "*" | quote }}
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_USE_PATH_STYLE: {{ .Values.s3.usePathStyle | toString | quote }}
  RUNNER_NAMESPACE: {{ .Values.runner.namespace | quote }}
  RUNNER_INIT_IMAGE: {{ .Values.runner.initImage | quote }}
  RUNNER_INIT_CPU_REQUEST: {{ (default (dict) (default (dict) (default (dict) .Values.runner).initResources).requests).cpu | default "50m" | quote }}
  RUNNER_INIT_CPU_LIMIT: {{ (default (dict) (default (dict) (default (dict) .Values.runner).initResources).limits).cpu | default "200m" | quote }}
  RUNNER_INIT_MEMORY_REQUEST: {{ (default (dict) (default (dict) (default (dict) .Values.runner).initResources).requests).memory | default "64Mi" | quote }}
  RUNNER_INIT_MEMORY_LIMIT: {{ (default (dict) (default (dict) (default (dict) .Values.runner).initResources).limits).memory | default "256Mi" | quote }}
  RUNNER_DEFAULT_IMAGE: {{ .Values.runner.defaultImage | quote }}
  # Runner DNS configuration (Issue #217)
  RUNNER_DNS_NDOTS: {{ (default "2" (default (dict) .Values.runner).ndots) | toString | quote }}
  RUNNER_DNS_POLICY: {{ (default (dict) .Values.runner).dnsPolicy | default "" | quote }}
  RUNNER_DNS_NAMESERVERS: {{ (default (dict) (default (dict) .Values.runner).dnsConfig).nameservers | default (list) | join "," | quote }}
  RUNNER_DNS_SEARCHES: {{ (default (dict) (default (dict) .Values.runner).dnsConfig).searches | default (list) | join "," | quote }}
  # Runner S3 credentials secret configuration (Issue #216)
  RUNNER_S3_SECRET_NAME: {{ include "vuhive-cloud.runnerS3SecretName" . | quote }}
  RUNNER_S3_ACCESS_KEY_KEY: {{ (default (dict) .Values.runner).existingSecretAccessKey | default .Values.s3.existingSecretAccessKey | default "AWS_ACCESS_KEY_ID" | quote }}
  RUNNER_S3_SECRET_KEY_KEY: {{ (default (dict) .Values.runner).existingSecretSecretKey | default .Values.s3.existingSecretSecretKey | default "AWS_SECRET_ACCESS_KEY" | quote }}
  BUILDER_NAMESPACE: {{ .Values.builder.namespace | quote }}
  BUILDER_IMAGE: {{ .Values.builder.image | quote }}
  BUILDER_CPU_REQUEST: {{ (default (dict) (default (dict) (default (dict) .Values.builder).resources).requests).cpu | default "1000m" | quote }}
  BUILDER_CPU_LIMIT: {{ (default (dict) (default (dict) (default (dict) .Values.builder).resources).limits).cpu | default "2000m" | quote }}
  BUILDER_MEMORY_REQUEST: {{ (default (dict) (default (dict) (default (dict) .Values.builder).resources).requests).memory | default "1Gi" | quote }}
  BUILDER_MEMORY_LIMIT: {{ (default (dict) (default (dict) (default (dict) .Values.builder).resources).limits).memory | default "2Gi" | quote }}
  # Builder proxy & Go module network configuration (Issue #187)
  BUILDER_HTTP_PROXY: {{ (default (dict) .Values.builder.proxy).httpProxy | default "" | quote }}
  BUILDER_HTTPS_PROXY: {{ (default (dict) .Values.builder.proxy).httpsProxy | default "" | quote }}
  BUILDER_NO_PROXY: {{ (default (dict) .Values.builder.proxy).noProxy | default "" | quote }}
  BUILDER_GOPROXY: {{ .Values.builder.goProxy | default "" | quote }}
  BUILDER_GOPRIVATE: {{ .Values.builder.goPrivate | default "" | quote }}
  BUILDER_GONOSUMCHECK: {{ .Values.builder.goNosumcheck | default "" | quote }}
  BUILDER_DNS_POLICY: {{ .Values.builder.dnsPolicy | default "" | quote }}
  API_CALLBACK_URL: {{ include "vuhive-cloud.apiCallbackUrl" . | quote }}
  HOUSEKEEPING_ENABLED: {{ (default (dict) .Values.housekeeping).enabled | default true | toString | quote }}
  HOUSEKEEPING_INTERVAL: {{ (default (dict) .Values.housekeeping).interval | default "6h" | quote }}
  HOUSEKEEPING_DRY_RUN: {{ (default (dict) .Values.housekeeping).dryRun | default false | toString | quote }}
  RETENTION_APPLY_S3_LIFECYCLE: {{ (default (dict) .Values.housekeeping).applyS3Lifecycle | default true | toString | quote }}
  RETENTION_LOGS_DAYS: {{ (default (dict) (default (dict) .Values.housekeeping).retention).logsDays | default 14 | toString | quote }}
  RETENTION_REPORTS_DAYS: {{ (default (dict) (default (dict) .Values.housekeeping).retention).reportsDays | default 90 | toString | quote }}
  RETENTION_SOURCES_DAYS: {{ (default (dict) (default (dict) .Values.housekeeping).retention).sourcesDays | default 30 | toString | quote }}
  RETENTION_BINARIES_DAYS: {{ (default (dict) (default (dict) .Values.housekeeping).retention).binariesDays | default 30 | toString | quote }}
  RETENTION_RUNS_DAYS: {{ (default (dict) (default (dict) .Values.housekeeping).retention).runsDays | default 180 | toString | quote }}
  RETENTION_ARCHIVE_ONLY: {{ (default (dict) (default (dict) .Values.housekeeping).retention).archiveOnly | default false | toString | quote }}
  AUTH_ENABLED: {{ (default (dict) .Values.auth).enabled | default false | toString | quote }}
  OIDC_ISSUER_URL: {{ (default (dict) .Values.auth).issuerUrl | default "" | quote }}
  OIDC_JWKS_URL: {{ (default (dict) .Values.auth).jwksUrl | default "" | quote }}
  RUNNER_CLIENT_ID: {{ (default (dict) (default (dict) .Values.auth).runner).clientId | default "" | quote }}
  RUNNER_TOKEN_URL: {{ (default (dict) (default (dict) .Values.auth).runner).tokenUrl | default "" | quote }}


