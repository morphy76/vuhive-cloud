{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vuhive-cloud.fullname" . }}-runner-isolation
  namespace: {{ .Values.runner.namespace | default .Release.Namespace }}
  labels:
    {{- include "vuhive-cloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vuhive-runner
  policyTypes:
    - Egress
  egress:
    # 1. DNS Resolution (UDP & TCP 53)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 2. Control Plane & S3/MinIO Callbacks
    {{- if and .Values.runner.namespace (ne .Values.runner.namespace .Release.Namespace) }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: {{ .Values.service.port | default 8080 }}
          protocol: TCP
        - port: {{ .Values.s3.port | default 9000 }}
          protocol: TCP
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "vuhive-cloud.name" . }}
      ports:
        - port: {{ .Values.service.port | default 8080 }}
          protocol: TCP
        - port: {{ .Values.s3.port | default 9000 }}
          protocol: TCP
    {{- end }}
    # 3. Systems Under Test (excluding Cloud Metadata & internal Kubernetes Service CIDR)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.runner.targetCIDR | default "0.0.0.0/0" }}
            except:
              {{- if .Values.networkPolicy.runner.denyMetadata }}
              - {{ .Values.networkPolicy.runner.metadataCIDR | default "169.254.169.254/32" }}
              {{- end }}
              {{- if .Values.networkPolicy.runner.denyClusterCIDR }}
              {{- range .Values.networkPolicy.runner.clusterCIDRs }}
              - {{ . }}
              {{- end }}
              {{- end }}
    {{- with .Values.networkPolicy.runner.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
