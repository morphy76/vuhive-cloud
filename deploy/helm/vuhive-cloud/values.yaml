# vuhive-cloud — Application Helm values
# Control plane deployment referring to backing infrastructure dependencies.

replicaCount: 1

image:
  repository: ghcr.io/morphy76/vuhive-cloud/server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Automatically mount service account credentials token (required for k8s orchestrator)
  automountServiceAccountToken: true

rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # When false, scoped Role/RoleBindings are created in the release namespace
  # and runner namespace. When true, ClusterRole/ClusterRoleBindings are created.
  clusterScoped: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: vuhive-cloud.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── Infrastructure Bindings: PostgreSQL ─────────────────────────────────
# Points to an existing PostgreSQL deployment (e.g. from vuhive-cloud-infra).
database:
  host: "vuhive-infra-postgresql"
  port: 5432
  name: "vuhive"
  user: "vuhive"
  password: "vuhive-dev"
  sslmode: "disable"
  # Optional explicit full connection string. If provided, overrides host/port/etc.
  url: ""
  # Optional existing secret containing the database connection URL.
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Run database migrations via Helm pre-install / pre-upgrade hook job.
  autoMigrate: true

# ── Infrastructure Bindings: S3 / MinIO ─────────────────────────────────
# Points to an existing S3/MinIO deployment (e.g. from vuhive-cloud-infra).
s3:
  endpoint: "http://vuhive-infra-minio:9000"
  region: "us-east-1"
  bucket: "vuhive-artifacts"
  accessKeyId: "vuhive-dev"
  secretAccessKey: "vuhive-dev-secret"
  usePathStyle: true
  # Optional existing secret containing AWS/S3 access and secret keys.
  existingSecret: ""
  existingSecretAccessKey: "AWS_ACCESS_KEY_ID"
  existingSecretSecretKey: "AWS_SECRET_ACCESS_KEY"

# ── Runner & Builder Workload Orchestration ────────────────────────────
runner:
  namespace: "vuhive-runners"
  # When rbac.clusterScoped is false and runner.namespace differs from the release namespace,
  # set createNamespace: true to let Helm create the namespace automatically.
  # The namespace is created with "helm.sh/resource-policy: keep" so it is NOT deleted on helm uninstall.
  createNamespace: true
  initImage: "ghcr.io/morphy76/vuhive-cloud/runner-init:latest"
  defaultImage: "alpine:3.20"

builder:
  namespace: "vuhive-system"
  # When rbac.clusterScoped is false and builder.namespace differs from the release namespace,
  # set createNamespace: true to let Helm create the namespace automatically.
  # The namespace is created with "helm.sh/resource-policy: keep" so it is NOT deleted on helm uninstall.
  createNamespace: true
  image: "golang:1.26-alpine"

# API Callback URL used by runner jobs to report completion/status to control plane.
# If empty, automatically configured as http://<fullname>.<namespace>.svc.cluster.local:<port>
apiCallbackUrl: ""

nodeSelector: {}

tolerations: []

affinity: {}

extraEnv: []
extraEnvFrom: []
