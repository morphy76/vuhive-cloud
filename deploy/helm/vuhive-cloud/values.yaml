# vuhive-cloud — Application Helm values
# Control plane deployment referring to backing infrastructure dependencies.

replicaCount: 1

image:
  repository: ghcr.io/morphy76/vuhive-cloud/server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Automatically mount service account credentials token (required for k8s orchestrator)
  automountServiceAccountToken: true

rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # When false, scoped Role/RoleBindings are created in the release namespace
  # and runner namespace. When true, ClusterRole/ClusterRoleBindings are created.
  clusterScoped: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: vuhive-cloud.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── Infrastructure Bindings: PostgreSQL ─────────────────────────────────
# Points to an existing PostgreSQL deployment (e.g. from vuhive-cloud-infra).
database:
  host: "vuhive-infra-postgresql"
  port: 5432
  name: "vuhive"
  user: "vuhive"
  password: "vuhive-dev"
  sslmode: "disable"
  # Optional explicit full connection string. If provided, overrides host/port/etc.
  url: ""
  # Optional existing secret containing the database connection URL.
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Run database migrations via Helm pre-install / pre-upgrade hook job.
  autoMigrate: true

# ── Infrastructure Bindings: S3 / MinIO ─────────────────────────────────
# Points to an existing S3/MinIO deployment (e.g. from vuhive-cloud-infra).
s3:
  endpoint: "http://vuhive-infra-minio:9000"
  region: "us-east-1"
  bucket: "vuhive-artifacts"
  accessKeyId: "vuhive-dev"
  secretAccessKey: "vuhive-dev-secret"
  usePathStyle: true
  # Optional existing secret containing AWS/S3 access and secret keys.
  existingSecret: ""
  existingSecretAccessKey: "AWS_ACCESS_KEY_ID"
  existingSecretSecretKey: "AWS_SECRET_ACCESS_KEY"

# ── Runner & Builder Workload Orchestration ────────────────────────────
runner:
  namespace: "vuhive-runners"
  # When rbac.clusterScoped is false and runner.namespace differs from the release namespace,
  # set createNamespace: true to let Helm create the namespace automatically.
  # The namespace is created with "helm.sh/resource-policy: keep" so it is NOT deleted on helm uninstall.
  createNamespace: true
  initImage: "ghcr.io/morphy76/vuhive-cloud/runner-init:latest"
  defaultImage: "alpine:3.20"

# ── Network Policy Hardening ──────────────────────────────────────────
networkPolicy:
  # Enable egress NetworkPolicy to isolate test runner pods conforming to restricted security standards.
  enabled: false
  runner:
    # Deny cloud instance metadata API (169.254.169.254/32) to prevent IAM credential theft.
    denyMetadata: true
    metadataCIDR: "169.254.169.254/32"
    # Deny Kubernetes internal Cluster/Service CIDR (default: 10.96.0.0/12) to block API server access.
    denyClusterCIDR: true
    clusterCIDRs:
      - "10.96.0.0/12"
    # Target CIDRs allowed for load testing (0.0.0.0/0 except metadata and internal cluster CIDRs).
    targetCIDR: "0.0.0.0/0"
    # Additional allowed egress rules if needed.
    additionalEgress: []

builder:
  namespace: "vuhive-system"
  # When rbac.clusterScoped is false and builder.namespace differs from the release namespace,
  # set createNamespace: true to let Helm create the namespace automatically.
  # The namespace is created with "helm.sh/resource-policy: keep" so it is NOT deleted on helm uninstall.
  createNamespace: true
  image: "golang:1.26-alpine"

  # ── Network & Proxy Settings (Issue #187) ───────────────────────────────
  # Configure these when builder pods run in corporate, air-gapped, or otherwise
  # network-restricted Kubernetes clusters where Go module downloads fail.
  #
  # Troubleshooting: if you see "dial tcp 127.0.0.1:443: connect: connection refused"
  # during go mod tidy, either DNS is failing or an incorrect proxy is routing traffic
  # to localhost. Set httpsProxy to your corporate HTTP/CONNECT proxy URL and/or
  # configure goProxy to point to an internal Athens/GOPROXY mirror.
  proxy:
    # HTTP_PROXY injected into builder container env (e.g. "http://proxy.corp:3128").
    httpProxy: ""
    # HTTPS_PROXY injected into builder container env.
    httpsProxy: ""
    # NO_PROXY — comma-separated list of hosts/CIDRs that bypass the proxy.
    noProxy: ""

  # GOPROXY — Go module proxy chain injected as the GOPROXY env var.
  # Leave empty to use Go's built-in default ("https://proxy.golang.org,direct").
  # Use an internal Athens mirror URL for air-gapped environments:
  #   e.g. "https://goproxy.corp.internal,direct"
  goProxy: ""

  # GOPRIVATE — comma-separated module path prefixes fetched directly,
  # bypassing GOPROXY and checksum verification (e.g. "github.com/corp/*").
  goPrivate: ""

  # GONOSUMCHECK — comma-separated module path patterns whose checksums are not
  # verified against sum.golang.org (e.g. "github.com/corp/*").
  goNosumcheck: ""

  # DNS policy for builder pods. Leave empty to use the cluster default (ClusterFirst).
  # Set to "None" when providing custom nameservers via dnsConfig below.
  # Valid values: ClusterFirst, ClusterFirstWithHostNet, Default, None.
  dnsPolicy: ""

  # Custom DNS configuration applied to builder pods when dnsPolicy is "None"
  # or when custom nameservers/search domains are needed.
  # Mirrors the Kubernetes PodDNSConfig spec.
  dnsConfig: {}
  #   nameservers:
  #     - 8.8.8.8
  #     - 1.1.1.1
  #   searches:
  #     - corp.internal

  # NetworkPolicy for builder pods — allows egress to DNS, HTTPS (proxy.golang.org,
  # external Git), and internal S3/MinIO. Enable in namespaces with default-deny egress.
  networkPolicy:
    enabled: false

# API Callback URL used by runner jobs to report completion/status to control plane.
# If empty, automatically configured as:
#   - http://<fullname>:<port>/api/v1/runs/complete (when runner and control plane share the same namespace)
#   - http://<fullname>.<namespace>.svc.cluster.local.:<port>/api/v1/runs/complete (cross-namespace, trailing dot mitigates ndots:5 upstream search hijacking)
apiCallbackUrl: ""

# ── CORS Configuration ────────────────────────────────────────────────
cors:
  # Allowed cross-origin domains for browser clients and Swagger UI (comma-separated or "*").
  allowedOrigins: "*"

# ── Execution Artifact Housekeeping & Storage Retention Engine ────────
housekeeping:
  # Enable automatic background housekeeping worker
  enabled: true
  # Execution interval for background housekeeping sweeps (e.g. 1h, 6h, 24h)
  interval: "6h"
  # Run housekeeping in dry-run mode (audit only without deleting artifacts)
  dryRun: false
  # Automatically configure native S3/MinIO bucket lifecycle expiration rules
  applyS3Lifecycle: true
  retention:
    # TTL for raw runner and worker log files (run.log) in days
    logsDays: 14
    # TTL for full JSON execution reports (summary.json) in days (runs transitioned to ARCHIVED)
    reportsDays: 90
    # TTL for test suite source archives (source.tar.gz) in days
    sourcesDays: 30
    # TTL for compiled test runner binaries in days
    binariesDays: 30
    # Retention horizon for historical test run database records in days
    runsDays: 180
    # Archive runs instead of hard deleting historical records past runsDays
    archiveOnly: false

# ── Authentication & REST API Security (OIDC / Keycloak) ────────────────
auth:
  # Enable OIDC JWT verification and RBAC on /api/v1 endpoints
  enabled: false
  # OIDC realm issuer URL (e.g. http://vuhive-infra-keycloak:8080/realms/vuhive)
  issuerUrl: ""
  # JWKS JSON Web Key Set URL (e.g. http://vuhive-infra-keycloak:8080/realms/vuhive/protocol/openid-connect/certs)
  jwksUrl: ""
  # Runner M2M OAuth2 credentials injected into Runner Job manifests
  runner:
    clientId: "vuhive-runner"
    clientSecret: "vuhive-runner-secret"
    tokenUrl: ""
    existingSecret: ""
    existingSecretKey: "RUNNER_CLIENT_SECRET"

# ── Backend-For-Frontend (BFF) & Web Dashboard ──────────────────────────
# Deploys the Go BFF proxying API requests and serving the embedded React 19 PWA.
bff:
  # Enable BFF sub-deployment and web UI
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/morphy76/vuhive-cloud/bff
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
    annotations: {}

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Polling & SSE stream tuneables
  ssePollInterval: "2s"
  sseHeartbeatInterval: "15s"

  # Optional upstream control plane URL override.
  # Defaults to: http://<fullname>:<service.port>
  controlPlaneUrl: ""
  # Optional bearer token for control plane if required
  controlPlaneToken: ""

  # Persistent PostgreSQL session storage configuration (bff_sessions)
  database:
    # Optional PostgreSQL connection URL override for BFF sessions.
    # If empty, defaults to chart's PostgreSQL connection (vuhive-cloud.databaseUrl).
    url: ""
    existingSecret: ""
    existingSecretKey: "DATABASE_URL"
    autoMigrate: true

  # Session lifecycle, sliding expiration, and token encryption settings
  session:
    ttl: "24h"
    slidingThreshold: "15m"
    cleanerInterval: "10m"
    encryptionKey: ""
    encryptionKeyExistingSecret: ""
    encryptionKeyKey: "session-encryption-key"

  # Keycloak OIDC Token Handler configuration
  keycloak:
    baseUrl: ""
    realm: "vuhive"
    issuerUrl: ""
    jwksUrl: ""
    clientId: "vuhive-cloud-bff"
    clientSecret: "vuhive-bff-secret"
    clientSecretExistingSecret: ""
    clientSecretKey: "client-secret"
    sessionCookieSecret: ""
    sessionCookieSecretRef: ""
    sessionCookieSecretKey: "session-cookie-secret"
    sessionCookieName: "vuhive_session"

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraEnvFrom: []



